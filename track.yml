title: SUSE Virtualization Rodeo
description: |
  <span style="font-family: suse; src: url('https://fonts.google.com/specimen/SUSE');"><p>Step into <b style="color: #30ba78">Vertex Trust Bank</b> and take command of <b style="color: #30ba78">SUSE Virtualization</b>, the enterprise HCI platform (Harvester) managed by <b style="color: #30ba78">Rancher Prime</b>, as the bank moves off its costly legacy hypervisor.</p>

  <p>Across eight story-driven chapters you will solve real IT crises with SUSE's tools: bring a cluster online, deploy VMs under pressure, run a zero-downtime live migration, isolate a sensitive database with software-defined networking, recover data with snapshots, and scale a fleet from templates.</p>

  <p>This workshop gives you practical, hands-on skills for running virtual machines on a modern, Kubernetes-native platform.</p>

  <p>Let's get started.</p></span>
