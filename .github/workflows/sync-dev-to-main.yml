name: Sync dev to main

# Opens (or reuses) a dev -> main PR after every push to dev, with a fixed
# Conventional Commit title ("chore: sync dev into main") so the PR title
# lint check never fails on this path again. Before this workflow existed,
# that PR had to be opened by hand via GitHub's "Compare & pull request"
# prompt, which pre-fills the title from the last commit on dev (often a
# merge commit like "Merge pull request #13 from ...") — that default title
# doesn't match Conventional Commits and fails the "PR title" lint check
# every time. This workflow always sets the title explicitly, so that
# failure mode goes away.
#
# This does NOT merge anything — publishing dev into main, and then main to
# the live Instruqt track, both stay deliberate manual steps (see README.md).

on:
  push:
    branches: [dev]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open sync PR if one isn't already open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head dev --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "PR #$existing already open for dev -> main, nothing to do."
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head dev \
              --title "chore: sync dev into main" \
              --body "Automated sync of dev into main. Opened by the sync-dev-to-main workflow after a push to dev."
          fi
