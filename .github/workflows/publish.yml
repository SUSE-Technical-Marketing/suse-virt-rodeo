name: Publish Instruqt Track

# Validates and pushes the track on every push to main.
# Requires INSTRUQT_TOKEN in repo secrets and the image suse/suse-virt-rodeo-rc1
# published in the Instruqt org. Use workflow_dispatch to publish manually from
# any branch.
#
# FIXED 2026-07-21: every run of this workflow was failing at "Can't find
# 'action.yml' ... for action 'instruqt/cli@v1'" — instruqt/cli has no
# top-level action at all, only two subdirectory actions confirmed live
# against the instruqt/cli repo: instruqt/cli/setup@v1 (installs the CLI
# binary) and instruqt/cli/validate@v1 (wraps `instruqt lab validate`, no
# token needed). There's no dedicated push action, so the CLI is installed
# via setup and then invoked directly with `instruqt track push`, matching
# this repo's own documented local workflow (see README.md). This means NO
# push to this repo (main or otherwise) had ever successfully published to
# Instruqt via this workflow until this fix — every prior publish only ever
# happened through someone running `instruqt track push` locally.
#
# FIXED 2026-07-21 (same day, second issue): dropped the validate step —
# `instruqt lab validate .` (setup@v1 installs "latest" by default) errors
# with "config does not contain a lab resource", since the current CLI's
# validate command expects a newer "lab resource" format this repo's
# track.yml/config.yml structure predates. Push still uses `track` verbs
# and is unaffected; re-add validation later once pinned to a CLI version
# that still understands this repo's track-based format, or once the repo
# is migrated to whatever format `instruqt lab validate` expects.
#
# FIXED 2026-07-21 (same day, third issue): `track push --token ...` was
# never valid syntax — `instruqt track push --help` only lists --force/-h.
# `instruqt auth login` is interactive/session-based (1hr token, no
# non-interactive flag), so it's not usable in CI. Confirmed via
# docs.instruqt.com/tracks/manage/test-a-track that INSTRUQT_TOKEN as an
# environment variable (not a CLI flag, not auth login) is the documented
# CI mechanism — the CLI reads it automatically. This workflow now sets it
# as env on the push step only. REMAINING BLOCKER: this repo's INSTRUQT_TOKEN
# secret does not actually exist (confirmed empty in a live run on
# 2026-07-21) — add a real Instruqt API token at Settings > Secrets and
# variables > Actions > New repository secret before this can succeed.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual publish"
        required: false
        default: "manual publish"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Instruqt CLI
        uses: instruqt/cli/setup@v1

      - name: Push track to Instruqt
        env:
          INSTRUQT_TOKEN: ${{ secrets.INSTRUQT_TOKEN }}
        run: instruqt track push --force