name: Publish Instruqt Track

# AUTO-PUBLISH DISABLED
# The Instruqt track infrastructure (org, sandbox image, secrets) must be
# created before this workflow can run. Enable it by restoring the push trigger
# once the image suse/suse-virt-rodeo-180 is published and INSTRUQT_TOKEN is
# set in the repo secrets.
#
# To re-enable: replace the trigger below with:
#   on:
#     push:
#       branches:
#         - main

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual publish"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate track
        uses: instruqt/cli@v1
        with:
          command: track validate --token ${{ secrets.INSTRUQT_TOKEN }}

      - name: Push track to Instruqt
        uses: instruqt/cli@v1
        with:
          command: track push --token ${{ secrets.INSTRUQT_TOKEN }} --force
