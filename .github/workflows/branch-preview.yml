name: Branch Preview Track

# Rebrands the one Instruqt track this repo owns (fixed `id` in track.yml, already
# maintenance: true) with the pushing branch's name, then pushes it — so branch content
# can be reviewed on Instruqt without a separate manual publish step. On main, the branch
# suffix is stripped back to nothing, so the track reads with its plain production name.
#
# track.yml's `slug` and `title` carry a literal `__BRANCH__` placeholder. This workflow
# replaces every occurrence of it with `-<branch, lowercased and slugified>` (e.g. `-dev`),
# or with nothing when the branch is main. The substitution happens only on the
# CI runner's checked-out working tree — nothing is committed back to git, so the
# placeholder stays in the repo for the next run.
#
# Because this always targets the SAME track id, every branch's push relabels the one
# track (last push wins) rather than creating a separate track per branch. That's
# deliberate: track.yml already carries maintenance: true, so the track isn't
# learner-visible/bookable regardless of which branch most recently pushed to it.
#
# NOTE: track.yml's slug/title now permanently contain `__BRANCH__` in git. A manual
# `instruqt track push` from a local checkout (the flow CONTRIBUTING.md/README.md
# document for publishing to production) would push that literal placeholder text unless
# it's stripped first — this workflow's substitution only happens on the CI runner. If
# manual production publishing is still expected to work, CONTRIBUTING.md/README.md need
# a matching "replace __BRANCH__ with nothing" step added to those instructions.

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual preview run"
        required: false
        default: "manual preview run"

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Instruqt CLI
        uses: instruqt/cli/setup@v1

      - name: Configure Instruqt default team
        # `instruqt track create` failed CI with "Default team not configured. Use
        # `instruqt auth login` to set it." (confirmed via a live run, 2026-08-21) —
        # `auth login` is interactive-only, so the team is set non-interactively via
        # `instruqt config set team` instead. This workflow no longer calls `track
        # create`, but keeping this is cheap insurance in case `validate`/`push` need it
        # too.
        env:
          INSTRUQT_TOKEN: ${{ secrets.INSTRUQT_TOKEN }}
        run: |
          set -e
          OWNER=$(grep '^owner:' track.yml | awk '{print $2}')
          instruqt config set team "$OWNER"

      - name: Replace __BRANCH__ placeholder in track.yml
        run: |
          set -e
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "main" ]; then
            REPL=""
          else
            BRANCH_LOWER=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's#[/_ ]+#-#g; s#[^a-z0-9-]##g')
            REPL="-${BRANCH_LOWER}"
          fi
          python3 - "$REPL" <<'PYEOF'
          import pathlib
          import sys

          repl = sys.argv[1]
          path = pathlib.Path("track.yml")
          path.write_text(path.read_text().replace("__BRANCH__", repl))
          PYEOF

      - name: Validate track
        run: instruqt track validate

      - name: Push track
        env:
          INSTRUQT_TOKEN: ${{ secrets.INSTRUQT_TOKEN }}
        run: instruqt track push --force
