---
# Add {{ host_ssh_port }} as an sshd listen port. Instruqt's
# `allow_external_ingress: high-ports` (config.yml) only exposes ports >= 1024,
# so port 22 is unreachable externally; 1068 is.
#
# Note: the drop-in ADDS a port rather than replacing 22. sshd will listen on
# both 22 and 1068. Port 22 remains blocked externally by Instruqt, so this is
# fine for the lab — but be aware if you ever need to close it internally.
#
# Drop-in only — /etc/ssh/sshd_config on SLES 16 ships with
# `Include /etc/ssh/sshd_config.d/*.conf`, and a drop-in survives openssh
# package updates that would prompt over an edited main config.

- name: Set sshd port via drop-in
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-rodeo-port.conf
    content: |
      Port {{ host_ssh_port }}
    owner: root
    group: root
    mode: "0600"
  notify: restart sshd

# SELinux is permissive on this host (selinux.yml), so an unlabeled port does
# not block sshd today — but label it anyway so nothing breaks if the image
# ever goes enforcing. Best-effort: semanage may not be installed on SLES 16.
- name: Label the ssh port for SELinux (best effort)
  ansible.builtin.command: semanage port -a -t ssh_port_t -p tcp {{ host_ssh_port }}
  register: semanage_ssh_port
  changed_when: semanage_ssh_port.rc == 0 and 'already defined' not in (semanage_ssh_port.stderr | default(''))
  failed_when: false
