---
- name: daemon-reload
  ansible.builtin.systemd:
    daemon_reload: true

- name: restart libvirtd
  ansible.builtin.systemd:
    name: "{{ libvirt_service }}"
    state: restarted

- name: restart kvm-dnat
  ansible.builtin.systemd:
    name: kvm-dnat
    state: restarted

- name: reload firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: reloaded
