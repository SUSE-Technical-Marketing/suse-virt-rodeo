---
image_dir: /var/lib/libvirt/images
config_dir: /root/harvester-configs
serial_log_dir: /var/log/libvirt/qemu

harvester_version: "1.8.0"
harvester_iso_checksum: ""  # set to "sha256:<hash>" from Harvester release page to verify downloads
harvester_vip: "192.168.122.11"
harvester_token: "HarvesterRodeoBootstrapToken2024"
harvester_os_password: "HarvesterRodeo2024!"

rancher_vm_password: "RancherRodeo2024!"

ovmf_code: /usr/share/qemu/ovmf-x86_64-code.bin
ovmf_vars_template: /usr/share/qemu/ovmf-x86_64-vars.bin

libvirt_pool_name: default
libvirt_pool_path: /var/lib/libvirt/images
libvirt_network_name: default
libvirt_network_gateway: "192.168.122.1"

leap16_url: "https://download.opensuse.org/distribution/leap/16.0/appliances/openSUSE-Leap-16.0-Minimal-VM.x86_64-Cloud.qcow2"

libvirt_flavors:
  harvester:
    memory_mib: 24576
    vcpu: 8
    disk_gb: 270
  rancher:
    memory_mib: 16384
    vcpu: 4
    disk_gb: 60

# NIC assignment per Harvester node (all on virbr0 — lab single-bridge constraint)
#
#   eth0  management  02:00:00:0D:62:Ex  static IP from installer, cluster API
#   eth1  storage     02:00:00:0D:63:Ex  Longhorn storage traffic
#   eth2  migration   02:00:00:0D:64:Ex  KubeVirt live migration
#   eth3  service1    02:00:00:0D:65:Ex  Kube-OVN OVN uplink (primary VM networks)
#   eth4  service2    02:00:00:0D:66:Ex  Kube-OVN second uplink / additional VM network
#
# Only eth0 has a libvirt DHCP static reservation — Harvester manages the others.
# Rancher VM has management NIC only (no cluster roles, no storage/migration).

vm_nodes:
  - name: harvester1
    flavor: harvester
    uuid: "1c5e1f38-1fb8-4f03-9eaa-12838f70faa1"
    mgmt_mac: "02:00:00:0D:62:E1"
    storage_mac: "02:00:00:0D:63:E1"
