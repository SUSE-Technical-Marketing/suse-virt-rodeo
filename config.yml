version: "3"
virtualmachines:
- name: geekohive
  # Image built from SLES 16 with KVM + 3 Harvester 1.8.1 nodes + K3s v1.35/Rancher 2.14.1
  image: suse/suse-virt-rodeo-180
  shell: /bin/bash
  machine_type: n2-standard-32
  enable_nested_virtualization: true
  allow_external_ingress:
  - high-ports
  - http
  - https
  environment:
    RANCHER_CLUSTER_NAME: local
containers:
- name: cloud-client
  image: gcr.io/instruqt/cloud-client
  shell: /bin/bash
  ports:
  - 80
  - 90
  - 91
  - 92
  memory: 2048

