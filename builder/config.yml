version: "3"
virtualmachines:
- name: geekohive
  # Builder VM: SLES 16 base with nested virt — used to bake the custom rodeo image.
  image: suse/harv-rodeo-sles16
  shell: /bin/bash
  machine_type: n2-standard-32
  enable_nested_virtualization: true
  allow_external_ingress:
  - high-ports
  - http
  - https
