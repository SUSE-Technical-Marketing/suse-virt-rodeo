slug: suse-virt-rodeo-builder
title: SUSE Virt Rodeo — Image Builder
description: |
  Builder track for the suse-virt-rodeo-180 custom Instruqt image.
  Runs Ansible, deploys nested KVM VMs (3x Harvester + 1x Rancher), clusters them,
  and prepares the environment for snapshot as a reusable Instruqt image.
  Not intended for end users — internal use only.
