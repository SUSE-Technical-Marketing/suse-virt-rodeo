description: |
  <span style="font-family: suse; src: url('https://fonts.google.com/specimen/SUSE');"><p><b style="color: #30ba78">AEROGRID OPERATIONS — SUSE VIRTUALIZATION MIGRATION LAB</b></p>

  <p>AeroGrid manages IT for a regional international airport. When the Broadcom acquisition closed, their VMware renewal quote came in at 3.2x the previous cost. They chose <b style="color: #30ba78">SUSE Virtualization</b> (Harvester). You are the infrastructure engineer getting it operational.</p>

  <p>Over the course of this rodeo you will bring up the cluster, create the ramp control backbone VLAN and airline tenant isolation zones, provision the first ground ops VM with live migration, protect flight data with snapshots and restore from them, provision a K3s passenger check-in cluster via <b style="color: #30ba78">SUSE Rancher Prime</b>, and deploy the AeroGrid NOC dashboard so the ops team has live visibility into the platform.</p>

  <p>All of this runs on open-source CNCF technology — no proprietary hypervisor, no vTax, no Broadcom invoice. Just the platform and the stack.</p>

  <p>Let's get it done.</p></span>
