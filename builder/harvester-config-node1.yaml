# Harvester 1.8.0 unattended install config — node1 (bootstrap / cluster creator)
# Ref: https://docs.harvesterhci.io/v1.8/install/harvester-configuration/
#
# This node creates the cluster and sets the kube-vip VIP.
# harvester2 and harvester3 join using the token generated here.

scheme_version: 1

server_url: ""          # empty on the first node — this IS the server

token: "HarvesterRodeoBootstrapToken2024"

os:
  hostname: harvester1
  password: "HarvesterRodeo2024!"   # root password inside the Harvester OS
  ntp_servers:
    - 0.pool.ntp.org
    - 1.pool.ntp.org
  dns_nameservers:
    - 8.8.8.8
    - 1.1.1.1

install:
  mode: create           # create = bootstrap a new cluster
  management_interface:
    interfaces:
      - name: eth0       # virbr0 management NIC (e1000, MAC 02:00:00:0D:62:E1)
    method: static
    ip: 192.168.122.11
    subnet_mask: 255.255.255.0
    gateway: 192.168.122.1
    bond_options:
      mode: active-backup
      miimon: 100
  vip: 192.168.122.11    # kube-vip address — same as node1 IP in this design
  vip_mode: static
  device: /dev/vda       # 250 GB OS disk
  tty: ttyS0
  poweroff: false
