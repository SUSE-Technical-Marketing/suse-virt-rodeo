# Harvester 1.8.0 unattended install config — node3 (join node)
# Ref: https://docs.harvesterhci.io/v1.8/install/harvester-configuration/
#
# Joins the cluster bootstrapped by harvester1.

scheme_version: 1

server_url: "https://192.168.122.10:443"

token: "HarvesterRodeoBootstrapToken2024"

os:
  hostname: harvester3
  password: "HarvesterRodeo2024!"
  ntp_servers:
    - 0.pool.ntp.org
    - 1.pool.ntp.org
  dns_nameservers:
    - 8.8.8.8
    - 1.1.1.1

install:
  mode: join
  management_interface:
    interfaces:
      - name: eth0       # virbr0 management NIC (e1000, MAC 02:00:00:0D:62:E3)
    method: static
    ip: 192.168.122.13
    subnet_mask: 255.255.255.0
    gateway: 192.168.122.1
    bond_options:
      mode: active-backup
      miimon: 100
  vip: 192.168.122.10
  vip_mode: static
  device: /dev/vda
  tty: ttyS0
  poweroff: false
